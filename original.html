<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Missão GeoExploradores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .mission-btn {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 15px;
            background: #2980b9;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        .mission-content {
            display: none;
            background: #fff;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 150px;
            margin: 10px;
            cursor: pointer;
        }
        .feedback {
            margin-top: 20px;
            font-weight: bold;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .quiz button, .next-btn {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            border: none;
            background-color: #27ae60;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 40px);
            gap: 5px;
            margin: 20px auto;
            width: 220px;
        }
        .cell {
            width: 40px;
            height: 40px;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .robot {
            background: red;
            color: white;
        }
        .goal {
            background: green;
            color: white;
        }
    </style>
</head>
<body>

<h1>Missão GeoExploradores</h1>

<button class="mission-btn" data-mission="mission1">🧱 Missão 1: Figuras no Mundo Real</button>
<button class="mission-btn" data-mission="mission2">📐 Missão 2: Características das Formas</button>
<button class="mission-btn" data-mission="mission3">🧭 Missão 3: Caminhos e Direções</button>

<!-- Missão 1 -->
<div id="mission1" class="mission-content">
<h2>Missão 1: Qual objeto é um cilindro?</h2>
<p>Clique na imagem correta:</p>
<img src="https://upload.wikimedia.org/wikipedia/commons/2/2b/Soda_can.png" alt="Cilindro" onclick="mission1Result(true)">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Rubik%27s_cube_by_keqs.jpg" alt="Cubo" onclick="mission1Result(false)">
<div id="mission1-feedback" class="feedback"></div>
</div>

<!-- Missão 2 -->
<div id="mission2" class="mission-content">
<h2>Missão 2: Quantas arestas tem um cubo?</h2>
<div class="quiz">
<button onclick="mission2Result(false)">6</button>
<button onclick="mission2Result(true)">12</button>
<button onclick="mission2Result(false)">8</button>
</div>
<div id="mission2-feedback" class="feedback"></div>
</div>

<!-- Missão 3 -->
<div id="mission3" class="mission-content">
<h2>Missão 3: Leve o robô até o destino</h2>
<div class="grid" id="grid"></div>
<div style="text-align:center;">
<button onclick="move('up')">⬆️</button>
<button onclick="move('down')">⬇️</button>
<button onclick="move('left')">⬅️</button>
<button onclick="move('right')">➡️</button>
</div>
<div id="mission3-feedback" class="feedback"></div>
</div>

<script>
    // Mostrar missões
    document.querySelectorAll('.mission-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const missionId = btn.getAttribute('data-mission');
            document.querySelectorAll('.mission-content').forEach(div => {
                div.style.display = 'none';
            });
            document.getElementById(missionId).style.display = 'block';
        });
    });

    // Missão 1
    function mission1Result(correct) {
        const feedback = document.getElementById('mission1-feedback');
        if (correct) {
            feedback.innerHTML = `<p class="success">✅ Correto! Uma lata é um cilindro.</p><button class="next-btn" onclick="showNext('mission2')">Ir para Missão 2</button>`;
        } else {
            feedback.innerHTML = `<p class="error">❌ Tente novamente.</p>`;
        }
    }

    // Missão 2
    function mission2Result(correct) {
        const feedback = document.getElementById('mission2-feedback');
        if (correct) {
            feedback.innerHTML = `<p class="success">✅ Correto! Um cubo tem 12 arestas.</p><button class="next-btn" onclick="showNext('mission3')">Ir para Missão 3</button>`;
        } else {
            feedback.innerHTML = `<p class="error">❌ Resposta incorreta.</p>`;
        }
    }

    // Mostrar próxima missão
    function showNext(id) {
        document.querySelectorAll('.mission-content').forEach(div => div.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    // Missão 3 - Robô
    const gridSize = 5;
    let robotPos = { x: 0, y: 0 };
    const goalPos = { x: 4, y: 4 };
    const grid = document.getElementById("grid");

    function renderGrid() {
        grid.innerHTML = '';
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (robotPos.x === x && robotPos.y === y) {
                    cell.classList.add('robot');
                    cell.textContent = '🤖';
                } else if (goalPos.x === x && goalPos.y === y) {
                    cell.classList.add('goal');
                    cell.textContent = '🏁';
                }
                grid.appendChild(cell);
            }
        }
    }

    function move(direction) {
        if (direction === 'up' && robotPos.y > 0) robotPos.y--;
        if (direction === 'down' && robotPos.y < gridSize - 1) robotPos.y++;
        if (direction === 'left' && robotPos.x > 0) robotPos.x--;
        if (direction === 'right' && robotPos.x < gridSize - 1) robotPos.x++;

        renderGrid();
        checkVictory();
    }

    function checkVictory() {
        const feedback = document.getElementById('mission3-feedback');
        if (robotPos.x === goalPos.x && robotPos.y === goalPos.y) {
            feedback.innerHTML = `<p class="success">🎉 Parabéns! Você completou todas as missões!</p>`;
        }
    }

    window.onload = renderGrid;
</script>
</body>
</html>
